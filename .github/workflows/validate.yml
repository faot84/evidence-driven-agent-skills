name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Package structure and public text
        run: python -B scripts/validate.py
      - name: Calculator example tests
        run: python -B -m unittest discover -s examples/calculator -p "test_*.py" -v
      - name: Backup helper tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
